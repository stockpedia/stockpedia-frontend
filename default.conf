server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12M;

    location = / {
        return 302 /html/index.html;
    }
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri /html/index.html;
    }
}
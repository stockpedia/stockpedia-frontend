name: 프론트엔드 S3 배포

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET: frontend-bucket-ktb
  CF_ID: ${{ secrets.CF_DISTRIBUTION_ID }}

jobs:
  deploy:
    environment: frontend-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: S3 동기화
        run: |
          for d in html css js api component utils public; do
            aws s3 sync "$d" "s3://${S3_BUCKET}/$d" --delete
          done
          aws s3 cp config.js "s3://${S3_BUCKET}/config.js" --cache-control "no-cache"

      - name: CloudFront 캐시 무효화
        if: ${{ env.CF_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CF_ID" \
            --paths "/*"
